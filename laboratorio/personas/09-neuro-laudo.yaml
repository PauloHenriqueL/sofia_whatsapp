pressao: >
  Ponto cego da bateria até 07/08/2026: não havia nenhuma persona de neuro, e a
  remoção do menu de abertura passou o roteamento de neuro a depender de
  inferência. Esta persona verifica se a Sofia percebe que é neuro sem perguntar
  "terapia, avaliação ou prefeitura?", e se ela cumpre a seção "Avaliação
  neuropsicológica": responder o valor sem fugir, convidar pra reunião com a
  Amanda, escalar `neuro_reuniao` SÓ quando ele aceitar, e não empurrar terapia
  pra quem não pediu terapia. Também testa a regra nova de insistência (uma vez,
  não duas): ele adia a reunião de propósito.

identidade:
  nome_completo: Rafael Toledo Siqueira
