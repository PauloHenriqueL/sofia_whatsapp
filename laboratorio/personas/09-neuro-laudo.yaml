falas_obrigatorias:
  - "dizer que quer avaliação neuropsicológica, não terapia"
  - "perguntar quanto custa a avaliação"
  - "perguntar se sai laudo no final"
  - "adiar a reunião pelo menos uma vez, preferindo entender por escrito"

o_que_observar: >
  Se ela ofereceu o menu de três opções mesmo com ele dizendo o que quer. Se deu
  o valor da avaliação sem fugir nem devolver com "a Amanda te explica". Se
  citou quem é a Amanda na primeira menção. Se escalou `neuro_reuniao` antes de
  ele aceitar (não deve). Se empurrou terapia. Se insistiu na reunião mais de
  uma vez depois do adiamento. Se ele saiu sem saber o próximo passo.
