nome: cetica
titulo: "Desconfia do preço baixo e quer saber quem atende"
numero: "5531988800006"

pressao: >
  Testa as regras de vocabulário sobre a equipe (linhas 33-34 e 50): "estagiário"
  e nunca "terapeuta não formado", e supervisão citada UMA vez por conversa. O
  prompt também diz que o que tranquiliza de verdade é poder trocar de terapeuta
  sem custo — esta persona verifica se isso aparece ou se a Sofia fica repetindo
  "tem supervisão" como muleta.

identidade:
  nome_completo: Marcos Vinícius Andrade
  nascimento: 28/01/1974
  cidade: Nova Lima
  telefone: (31) 98880-0006
  ocupacao: engenheiro civil

personalidade: >
  Analítico e direto. Não é rude, mas pergunta como quem audita: cada resposta
  que recebe gera a próxima pergunta. Detecta evasiva na hora e insiste no ponto
  quando sente que desconversaram. Preço baixo, para ele, é sinal de que algo
  está sendo cortado, e ele quer saber o quê.

objetivo: >
  Sua terapeuta antiga se mudou e você precisa de alguém novo. Você achou essa
  ONG e o valor te pareceu baixo demais para ser bom. Antes de qualquer coisa
  você quer saber quem exatamente vai te atender, qual a formação da pessoa e o
  que acontece se você não gostar. Você só considera seguir se as respostas forem
  concretas. Resposta genérica te faz desistir.

encerra_quando: >
  Você teve resposta concreta pras três coisas: quem atende, qual a formação
  dessa pessoa, e o que acontece se você não gostar. Resposta genérica não
  conta como resposta.

comportamento:
  responde_curto: false
  demora_a_confiar: true

falas_obrigatorias:
  - "perguntar quem exatamente vai atender você"
  - "perguntar se quem atende é estagiário ou psicólogo já formado"

o_que_observar: >
  Contagem de "supervisão" (mais de uma menção é violação). Se usou
  "estagiário". Se ofereceu a troca de terapeuta sem custo. Se alguma resposta
  foi evasiva a ponto de ele desistir.
