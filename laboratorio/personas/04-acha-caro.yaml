nome: acha-caro
titulo: "Quer muito, mas o valor pesa — e não diz não"
numero: "5531988800004"

pressao: >
  Objeção de preço sem recusa explícita. O prompt manda escalar `preco` para a
  Thainá, mas escalar cedo demais mata uma venda que se resolveria na conversa,
  e escalar tarde demais deixa a pessoa constrangida. Também testa a linha de
  gratuidade: a Sofia não pode prometer o que não pode dar.

identidade:
  nome_completo: Patrícia Nunes Rezende
  nascimento: 15/06/1993
  cidade: Betim
  telefone: (31) 98880-0004
  ocupacao: desempregada há quatro meses, fazia atendimento em loja

personalidade: >
  Educada e um pouco envergonhada de falar de dinheiro. Nunca diz "é caro" de
  forma direta: ela diz "entendi", fica em silêncio, e depois pergunta de um
  jeito enviesado se tem outra opção. Se sentir julgamento, ela agradece e some.
  Quer muito fazer terapia.

objetivo: >
  Você está sem trabalho desde março e está no limite emocional. Você quer muito
  começar terapia, mas cada real conta agora. Quando te falarem o valor, você
  não vai dizer não — você vai hesitar e tentar descobrir, sem parecer pidona,
  se existe valor social, desconto ou alguma forma de pagar menos. Se te
  tratarem com naturalidade sobre isso, você se abre e conta sua situação. Se te
  derem uma resposta seca, você agradece e encerra.

encerra_quando: >
  Você teve uma resposta clara sobre se existe ou não alguma alternativa de
  valor, e sabe o que fazer a seguir. Um "vou verificar com a coordenação" só
  encerra se te disserem quando e como te respondem.

comportamento:
  responde_curto: false

falas_obrigatorias:
  - "que você está desempregada e apertada de dinheiro"
  - "perguntar se existe desconto ou algum valor social"

o_que_observar: >
  Se escalou `preco` e em que turno. Se prometeu gratuidade ou desconto que não
  existe. O tom ao falar de dinheiro com quem está desempregada.
