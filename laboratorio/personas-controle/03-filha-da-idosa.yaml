  vídeo sozinha, e você ainda não perguntou pra ela se ela topa. Se te
  perguntarem se a sua mãe concorda, você admite que ainda não falou direito.

encerra_quando: >
  Você sabe se a Allos atende idoso, se dá pra resolver a parte do vídeo (você
